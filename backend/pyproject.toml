[project]
name = "pdftalk"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "redis>=5.0.0",
    "rq",
    "boto3",
    "openai",
    "pymupdf",
    "tiktoken",
    "structlog",
    "python-multipart",
    "httpx",
    "email-validator",
    "resend>=2.30.1",
    "pgvector>=0.4.2",
    "aiosqlite>=0.22.1",
    "psycopg[binary]",
    "pytesseract",
    "pillow",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "python-magic>=0.4.27; sys_platform != 'win32'",
    "prometheus-client>=0.20.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pyjwt[crypto]>=2.13.0",
    "sentinel",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
"tests/**/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests requiring real PG + OpenAI",
]

[tool.uv.sources]
sentinel = { path = "vendor/sentinel-0.1.0-py3-none-any.whl" }

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "fakeredis",
    "moto[s3]>=5.2.1",
    "ruff>=0.12.0",
    "mypy>=1.17.0",
]
