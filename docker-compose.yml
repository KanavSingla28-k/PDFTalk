networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_logs:

services:

  postgres:
    image: pgvector/pgvector:pg15
    container_name: pdftalk-postgres-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdftalk}
      POSTGRES_USER: ${POSTGRES_USER:-pdftalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-pdftalk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pdftalk-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    networks:
      - internal
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: pdftalk-api:${GIT_SHA:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdftalk-api-prod
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    image: pdftalk-worker:${GIT_SHA:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: pdftalk-worker-prod
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
    stop_grace_period: 60s

  frontend:
    image: pdftalk-frontend:${GIT_SHA:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdftalk-frontend-prod
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.25-alpine
    container_name: pdftalk-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - app_logs:/var/log/nginx
    networks:
      - internal
      - external
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
