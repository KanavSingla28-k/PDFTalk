networks:
  internal:
    driver: bridge
  external:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_logs:
  prometheus_data:
  grafana_data:
  alertmanager_data:

  prometheus_multiproc:
    driver_opts:
      type: tmpfs
      device: tmpfs

services:

  postgres:
    image: pgvector/pgvector:pg15
    container_name: pdftalk-postgres-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdftalk}
      POSTGRES_USER: ${POSTGRES_USER:-pdftalk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-pdftalk}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: pdftalk-redis-prod
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
    networks:
      - internal
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 384M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: pdftalk-api:${GIT_SHA:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdftalk-api-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    volumes:
      - prometheus_multiproc:/tmp/prometheus_multiproc
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  worker:
    image: pdftalk-worker:${GIT_SHA:-latest}
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: pdftalk-worker-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
    volumes:
      - prometheus_multiproc:/tmp/prometheus_multiproc
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1536M
    stop_grace_period: 60s

  frontend:
    image: pdftalk-frontend:${GIT_SHA:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
          NEXT_PUBLIC_API_URL: http://13.207.100.137/api
          NEXT_PUBLIC_APP_NAME: PDFTalk
          NEXT_PUBLIC_MAX_UPLOAD_MB: 50
    container_name: pdftalk-frontend-prod
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - internal
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.25-alpine
    container_name: pdftalk-nginx-prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - app_logs:/var/log/nginx
    networks:
      - internal
      - external
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M

  # ---------- Monitoring (Prometheus Stack) ----------

  prometheus:
    image: prom/prometheus:v2.51.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
      - ./monitoring/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro
    networks: [internal]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
 
  grafana:
    image: grafana/grafana:10.4-alpine
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [internal]
    depends_on: [prometheus]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  alertmanager:
    image: prom/alertmanager:v0.27.0
    env_file:
      - .env
    entrypoint: ["/docker-entrypoint.sh"]
    volumes:
      - alertmanager_data:/alertmanager
      - ./monitoring/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./monitoring/alertmanager-entrypoint.sh:/docker-entrypoint.sh:ro
    networks:
      - internal
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
