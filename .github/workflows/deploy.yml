name: Deploy

on:
  push:
    branches: [main]

# Prevent concurrent deploys — if a deploy is in progress and another push
# lands on main, cancel the older run rather than queuing both.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build — Docker images
  # Runs on every push to main; artifacts handed off to the deploy job.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name
        run: |
          echo "GH_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # --- Backend images ---
      - name: Build and push API image
        run: |
          docker build \
            -t ghcr.io/${{ env.GH_REPO }}/pdftalk-api:${{ github.sha }} \
            -t ghcr.io/${{ env.GH_REPO }}/pdftalk-api:latest \
            ./backend
          docker push ghcr.io/${{ env.GH_REPO }}/pdftalk-api:${{ github.sha }}
          docker push ghcr.io/${{ env.GH_REPO }}/pdftalk-api:latest

      - name: Build and push worker image
        run: |
          docker build \
            -t ghcr.io/${{ env.GH_REPO }}/pdftalk-worker:${{ github.sha }} \
            -t ghcr.io/${{ env.GH_REPO }}/pdftalk-worker:latest \
            -f ./backend/Dockerfile.worker \
            ./backend
          docker push ghcr.io/${{ env.GH_REPO }}/pdftalk-worker:${{ github.sha }}
          docker push ghcr.io/${{ env.GH_REPO }}/pdftalk-worker:latest

      # --- Frontend image ---
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and push frontend image
        run: |
          docker build \
            --build-arg CI=true \
            --build-arg NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --build-arg NEXT_PUBLIC_APP_NAME=PDFTalk \
            --build-arg NEXT_PUBLIC_MAX_UPLOAD_MB=50 \
            -t ghcr.io/${{ env.GH_REPO }}/pdftalk-frontend:${{ github.sha }} \
            -t ghcr.io/${{ env.GH_REPO }}/pdftalk-frontend:latest \
            ./frontend
          docker push ghcr.io/${{ env.GH_REPO }}/pdftalk-frontend:${{ github.sha }}
          docker push ghcr.io/${{ env.GH_REPO }}/pdftalk-frontend:latest

  # ---------------------------------------------------------------------------
  # Deploy — requires manual approval (GitHub environment gate)
  # Set up: GitHub → Settings → Environments → production → add required reviewers
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Lightsail
    runs-on: ubuntu-latest
    needs: build
    environment: production   # Manual approval gate lives here

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase repository name
        run: |
          echo "GH_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Copy deployment files
        run: |
          ssh -i /tmp/deploy_key -o ConnectTimeout=30 ubuntu@${{ secrets.LIGHTSAIL_IP }} "mkdir -p /opt/pdftalk/infra/scripts"
          scp -i /tmp/deploy_key -o ConnectTimeout=30 docker-compose.yml ubuntu@${{ secrets.LIGHTSAIL_IP }}:/opt/pdftalk/docker-compose.yml
          scp -i /tmp/deploy_key -o ConnectTimeout=30 -r infra ubuntu@${{ secrets.LIGHTSAIL_IP }}:/opt/pdftalk/
          scp -i /tmp/deploy_key -o ConnectTimeout=30 infra/scripts/remote_deploy.sh ubuntu@${{ secrets.LIGHTSAIL_IP }}:/opt/pdftalk/remote_deploy.sh

      - name: Deploy
        run: |
          # The remote script (infra/scripts/remote_deploy.sh) is piped to a
          # remote bash -s over SSH, with the variables it needs passed as
          # real shell-assigned environment variables prefixed on that same
          # remote command — NOT interpolated into a heredoc string from this
          # workflow file. This removes every layer of nested quoting/escaping
          # that previously caused the deploy session to silently truncate
          # partway through the script (confirmed via the EXIT trap firing
          # with code=0 right after the pg_dump line in earlier runs — the
          # remote shell was receiving an incomplete script and treating it
          # as a complete one).
          chmod +x infra/scripts/remote_deploy.sh
          ssh -i /tmp/deploy_key -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=10 \
            ubuntu@${{ secrets.LIGHTSAIL_IP }} \
            "GIT_SHA='${{ github.sha }}' GH_REPO='${{ env.GH_REPO }}' GITHUB_TOKEN='${{ secrets.GITHUB_TOKEN }}' GITHUB_ACTOR='${{ github.actor }}' bash -s" \
            < infra/scripts/remote_deploy.sh

      - name: Smoke test
        # Wait for containers to pass their healthchecks before probing.
        # Hitting the domain over HTTPS to validate DNS, TLS, and Nginx.
        run: |
          echo "Waiting for API to become healthy..."
          sleep 15
          curl --fail \
               --silent \
               --show-error \
               --max-time 10 \
               --retry 3 \
               --retry-delay 5 \
               https://${{ secrets.APP_DOMAIN }}/api/live
          echo ""
          echo "Smoke test passed."

      - name: Clean up SSH key
        if: always()   # Run even if a previous step failed
        run: rm -f /tmp/deploy_key
