# nginx.prod.conf
# HTTPS live as of T-10. HTTP (80) now only redirects + serves ACME renewals.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;   # Don't expose nginx version in headers/error pages

    # Gzip — compresses frontend JS/CSS, speeds up initial page load
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/x-javascript text/xml
                      application/xml application/xml+rss text/javascript;

    # Log format — includes request time for latency visibility
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Upstream — matches docker-compose service name
    upstream api {
        server api:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # ---------------------------------------------------------------------------
    # Rate limiting zones (defined here, applied per-location below)
    # ---------------------------------------------------------------------------
    # Global API: 30 req/s per IP — blocks volumetric abuse before it hits Python
    limit_req_zone $binary_remote_addr zone=api_global:10m     rate=30r/s;
    # Auth endpoints: 5 req/min per IP — login/register brute-force protection
    limit_req_zone $binary_remote_addr zone=auth_endpoints:10m rate=5r/m;
    # Upload endpoint: 5 req/min per IP — prevents upload spam
    limit_req_zone $binary_remote_addr zone=upload_endpoint:10m rate=5r/m;

    # ---------------------------------------------------------------------------
    # HTTP (80) — redirect everything to HTTPS, except ACME renewals
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name pdftalk.kanavsingla.fyi;

        # ACME HTTP-01 challenge — must stay reachable for cert renewals
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Everything else redirects to HTTPS
        location / {
            return 301 https://pdftalk.kanavsingla.fyi$request_uri;
        }
    }

    # ---------------------------------------------------------------------------
    # HTTPS (443) — main server
    # ---------------------------------------------------------------------------
    server {
        listen 443 ssl http2;
        server_name pdftalk.kanavsingla.fyi;

        ssl_certificate     /etc/nginx/ssl/live/pdftalk.kanavsingla.fyi/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/pdftalk.kanavsingla.fyi/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        error_page 503 = @rate_limit;
        location @rate_limit {
            default_type application/json;
            add_header Retry-After 60 always;
            return 503 '{"error": "RATE_LIMIT_EXCEEDED", "message": "Too many requests, please try again later."}';
        }

        # --- Security headers ---
        add_header X-Frame-Options        "DENY"                                     always;
        add_header X-Content-Type-Options "nosniff"                                  always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

        # --- Frontend (Next.js server) ---
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Auth endpoints — strictest rate limit ---
        # Covers all auth mutation endpoints: login, register, resend-verification,
        # forgot-password, reset-password. All are brute-forceable if unprotected.
        location ~ ^/api/auth/(login|register|resend-verification|forgot-password|reset-password) {
            limit_req zone=auth_endpoints burst=3 nodelay;

            # Strip /api prefix: FastAPI routers are registered without it
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # --- DEPRECATED: legacy multipart upload endpoint ---
        # This block is intentionally removed. The old route /api/documents/upload
        # accepted the full file body (up to 55 MB) through Nginx and the API
        # container before reaching S3. It is replaced by the two blocks below.
        # The route still exists in the FastAPI router during the transition period;
        # any remaining calls to it will fall through to the generic /api/ block,
        # which enforces the default client_max_body_size (1MB) — callers using the
        # old path will receive a 413 from Nginx, clearly signalling migration needed.
        # Remove the old /documents/upload router endpoint once the frontend is
        # fully on the new flow and verified in production.

        # --- Presigned URL upload flow: Phase 1 ---
        # POST /api/documents/initiate-upload
        #
        # Receives file *metadata* only (filename, mime_type, file_size_bytes as JSON).
        # No file bytes ever pass through Nginx or the API container — the response
        # is a presigned S3 PUT URL the browser uses directly.
        # Body is a small JSON object; 4KB is more than enough.
        location /api/documents/initiate-upload {
            limit_req zone=upload_endpoint burst=2 nodelay;

            # Tiny JSON body — filename + size + MIME, nothing else
            client_max_body_size 4k;

            # Should respond in well under 1s (quota check + presign call to AWS)
            # 15s gives generous headroom for cold-start and high-load conditions
            proxy_read_timeout  15s;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # --- Presigned URL upload flow: Phase 3 ---
        # POST /api/documents/confirm-upload
        #
        # Called by the browser after the S3 PUT succeeds. Carries only a document_id
        # (UUID). The API runs a lightweight HeadObject call then enqueues the ingest job.
        # HeadObject is a metadata-only S3 call — no file bytes involved.
        location /api/documents/confirm-upload {
            limit_req zone=upload_endpoint burst=2 nodelay;

            # Body is just {"document_id": "<uuid>"} — 1KB is generous
            client_max_body_size 1k;

            # HeadObject + DB write + RQ enqueue: allow up to 20s
            # (HeadObject is fast ~100ms; extra headroom for RQ under load)
            proxy_read_timeout  20s;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # --- SSE streaming — buffering must be off ---
        # Must appear before the generic /api/ block (more specific wins)
        location /api/query/ask {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass             http://api;

            proxy_buffering        off;   # Critical — without this nginx buffers the
            proxy_cache            off;   # entire response and streaming is defeated
            proxy_read_timeout     300s;  # 5 min — longer than any realistic LLM response
            proxy_send_timeout     300s;
            proxy_http_version     1.1;
            proxy_set_header       Connection        '';
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            chunked_transfer_encoding on;
            add_header Cache-Control     "no-cache, no-store" always;
            add_header X-Accel-Buffering "no"                always;
        }

        # --- Grafana dashboard ---
        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /grafana;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- Block Prometheus UI from public access ---
        location /prometheus/ {
            deny all;
            return 404;
        }

        # --- Internal-only endpoints ---
        # Alertmanager webhook — internal Docker network only, never from browser
        location /api/internal/alerts/ {
            allow 172.0.0.0/8;
            deny all;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://api;
        }

        # Admin login/logout/stats — browser-accessible, protected by httpOnly cookie auth
        location /api/internal/admin/ {
            limit_req zone=api_global burst=10 nodelay;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # --- Block Prometheus /metrics from public internet ---
        # The FastAPI /metrics endpoint is for internal Prometheus scraping only.
        # It must never be reachable from outside the Docker network.
        # Returning 404 (not 403) so the endpoint appears to not exist at all —
        # a 403 would reveal the path is real, a 404 reveals nothing.
        location = /api/metrics {
            return 404;
        }

        # --- Block API documentation endpoints from public internet ---
        # FastAPI's docs_url/redoc_url/openapi_url are set to None in production
        # (controlled by settings.is_production in main.py). These Nginx blocks are
        # a defence-in-depth layer: even if the application flag is misconfigured,
        # the docs never reach the internet. Use 404, not 403, to reveal nothing.
        location = /api/docs {
            return 404;
        }
        location = /api/redoc {
            return 404;
        }
        location = /api/openapi.json {
            return 404;
        }

        # --- All other API endpoints ---
        location /api/ {
            limit_req zone=api_global burst=50 nodelay;
            client_max_body_size 64k;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }
}
