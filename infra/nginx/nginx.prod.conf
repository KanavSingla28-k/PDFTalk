# nginx.prod.conf
# HTTP-only until T-09 (DNS) and T-10 (Let's Encrypt) are complete.
# TODO T-10: uncomment the HTTPS server block, add ssl_* directives,
#            add HSTS header, and convert the HTTP block to a redirect.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;   # Don't expose nginx version in headers/error pages

    # Gzip — compresses frontend JS/CSS, speeds up initial page load
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/x-javascript text/xml
                      application/xml application/xml+rss text/javascript;

    # Log format — includes request time for latency visibility
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Upstream — matches docker-compose service name
    upstream api {
        server api:8000;
    }

    upstream frontend {
        server frontend:3000;
    }

    # ---------------------------------------------------------------------------
    # Rate limiting zones (defined here, applied per-location below)
    # ---------------------------------------------------------------------------
    # Global API: 30 req/s per IP — blocks volumetric abuse before it hits Python
    limit_req_zone $binary_remote_addr zone=api_global:10m     rate=30r/s;
    # Auth endpoints: 5 req/min per IP — login/register brute-force protection
    limit_req_zone $binary_remote_addr zone=auth_endpoints:10m rate=5r/m;
    # Upload endpoint: 5 req/min per IP — prevents upload spam
    limit_req_zone $binary_remote_addr zone=upload_endpoint:10m rate=5r/m;

    # ---------------------------------------------------------------------------
    # Main server — HTTP only (pre-SSL)
    # ---------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;   # Accepts any hostname until domain is set in T-09

        # --- Security headers ---
        # HSTS intentionally omitted until HTTPS is live (T-10)
        add_header X-Frame-Options        "DENY"                                     always;
        add_header X-Content-Type-Options "nosniff"                                  always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"          always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;

        # --- Frontend (Next.js server) ---
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Auth endpoints — strictest rate limit ---
        # Matches /api/auth/login and /api/auth/register before the generic /api/ block
        location ~ ^/api/(auth/login|auth/register) {
            limit_req zone=auth_endpoints burst=3 nodelay;

            # Strip /api prefix: FastAPI routers are registered without it
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # --- Upload endpoint — body size + rate limit ---
        location /api/documents/upload {
            limit_req zone=upload_endpoint burst=2 nodelay;

            # 55M: slightly above the 50MB app-level limit so FastAPI can return
            # a clean 413/422 instead of nginx returning its own 413 page
            client_max_body_size 55M;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass          http://api;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_read_timeout  60s;
        }

        # --- SSE streaming — buffering must be off ---
        # Must appear before the generic /api/ block (more specific wins)
        location /api/query/ask {
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass             http://api;

            proxy_buffering        off;   # Critical — without this nginx buffers the
            proxy_cache            off;   # entire response and streaming is defeated
            proxy_read_timeout     300s;  # 5 min — longer than any realistic LLM response
            proxy_send_timeout     300s;
            proxy_http_version     1.1;
            proxy_set_header       Connection        '';
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            chunked_transfer_encoding on;
            add_header Cache-Control     "no-cache, no-store" always;
            add_header X-Accel-Buffering "no"                always;
        }

        # --- Grafana dashboard ---
        location /grafana/ {
            proxy_pass http://grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /grafana;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- Block Prometheus UI from public access ---
        location /prometheus/ {
            deny all;
            return 404;
        }

        # --- Internal-only endpoints ---
        # Alertmanager webhook — internal Docker network only, never from browser
        location /api/internal/alerts/ {
            allow 172.0.0.0/8;
            deny all;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass http://api;
        }

        # Admin login/logout/stats — browser-accessible, protected by httpOnly cookie auth
        location /api/internal/admin/ {
            limit_req zone=api_global burst=10 nodelay;
            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # --- Block Prometheus /metrics from public internet ---
        # The FastAPI /metrics endpoint is for internal Prometheus scraping only.
        # It must never be reachable from outside the Docker network.
        # Returning 404 (not 403) so the endpoint appears to not exist at all —
        # a 403 would reveal the path is real, a 404 reveals nothing.
        location = /api/metrics {
            return 404;
        }

        # --- All other API endpoints ---
        location /api/ {
            limit_req zone=api_global burst=50 nodelay;

            rewrite ^/api(/.*)$ $1 break;
            proxy_pass         http://api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

