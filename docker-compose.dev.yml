services:

  postgres:
    image: pgvector/pgvector:pg15
    container_name: pdftalk-postgres

    environment:
      POSTGRES_DB: pdftalk
      POSTGRES_USER: pdftalk
      POSTGRES_PASSWORD: dev_postgres_password     # pragma: allowlist secret

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pdftalk"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: pdftalk-redis
    command: redis-server --requirepass dev_redis_password --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - internal

  sentinel-redis:
    image: redis:7-alpine
    container_name: pdftalk-sentinel-redis
    command:
      - redis-server
      - --requirepass
      - ${SENTINEL_REDIS_PASSWORD}
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6380:6379"
    restart: unless-stopped
    networks:
      - internal

  api:
    build:
      context: ./backend

    ports:
      - "8000:8000"

    environment:
      ENV_FILE: .env.local
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://pdftalk:dev_postgres_password@postgres:5432/pdftalk         # pragma: allowlist secret
      REDIS_URL: redis://:dev_redis_password@redis:6379
      SENTINEL_REDIS_URL: redis://:${SENTINEL_REDIS_PASSWORD:-sentinel-local-dev-password}@sentinel-redis:6379/0
    env_file:
      - ./backend/.env.local

    volumes:
      - ./backend:/app
      - /app/.venv
      - prometheus_multiproc:/tmp/prometheus_multiproc

    command: >
      .venv/bin/uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      sentinel-redis:
        condition: service_started

    networks:
      - internal

  worker:
    build:
      context: ./backend

    environment:
      ENV_FILE: .env.local
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://pdftalk:dev_postgres_password@postgres:5432/pdftalk      # pragma: allowlist secret
      REDIS_URL: redis://:dev_redis_password@redis:6379
      SENTINEL_REDIS_URL: redis://:${SENTINEL_REDIS_PASSWORD:-sentinel-local-dev-password}@sentinel-redis:6379/0
    env_file:
      - ./backend/.env.local

    volumes:
      - ./backend:/app
      - /app/.venv
      - prometheus_multiproc:/tmp/prometheus_multiproc

    command: .venv/bin/python -m app.workers.worker

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      sentinel-redis:
        condition: service_started

    networks:
      - internal

  nginx:
    image: nginx:alpine

    volumes:
      - ./infra/nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

    ports:
      - "80:80"

    depends_on:
      - api

    networks:
      - internal
      - external

volumes:
  postgres_data:
  redis_data:
  prometheus_multiproc:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  internal:
    driver: bridge

  external:
    driver: bridge
